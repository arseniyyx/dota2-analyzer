name: Refresh carry farm patterns

on:
  schedule:
    - cron: "40 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy==2.1.3
      - name: Build farm patterns
        run: python scripts/build_farm.py
        env:
          STRATZ_TOKEN: ${{ secrets.STRATZ_TOKEN }}
          FARM_ACCOUNTS: "150"
      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/farm.json
          git diff --cached --quiet && exit 0
          git commit -m "Refresh carry farm patterns"
          git pull --rebase origin main
          git push
