name: Refresh meta data

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      DAYS: "5"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy==2.1.3
      - name: Build data
        run: python scripts/build_data.py
        env:
          STRATZ_TOKEN: ${{ secrets.STRATZ_TOKEN }}
      - name: Build static pages
        run: python scripts/build_pages.py
      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data hero en heroes meta sitemap.xml sitemap.txt
          git diff --cached --quiet && exit 0
          git commit -m "Refresh meta data"
          git pull --rebase origin main
          git push
      - name: Tell Yandex and Bing about the pages (IndexNow)
        run: |
          sleep 90  # let GitHub Pages publish the fresh pages first
          python scripts/indexnow.py
        continue-on-error: true
